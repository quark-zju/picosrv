# Fail2ban filter for picosrv's one-line slog JSON request records.
# This intentionally relies only on Server.serveHTTP logging client_ip before
# ban_candidate. Other fields may be added, removed, or reordered freely.

[Definition]
failregex = ^.*"client_ip":"<HOST>".*"ban_candidate":true.*$
# Browsers request these public metadata and icon families automatically. Do not
# count failures for their root paths toward the ordinary authentication jail.
ignoreregex = ^.*"path":"/(?:apple-touch-icon(?:-(?:precomposed|[0-9]+x[0-9]+|v[0-9]+))*\.png|favicon(?:-(?:[0-9]+x[0-9]+|v[0-9]+))*\.(?:ico|png|svg)|android-chrome-[0-9]+x[0-9]+\.png|web-app-manifest-[0-9]+x[0-9]+\.png|mstile-[0-9]+x[0-9]+\.png|safari-pinned-tab\.svg|(?:site|manifest)\.webmanifest|manifest\.json|browserconfig\.xml)".*$

[Init]
journalmatch = _SYSTEMD_UNIT=picosrv.service
