# Fail2ban filter for picosrv's one-line slog JSON request records.
# Independent lookaheads deliberately avoid relying on JSON object key order.

[Definition]
failregex = ^(?=.*"msg":"request")(?=.*"client_ip":"<HOST>")(?=.*"ban_candidate":true).*$
ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=picosrv.service
